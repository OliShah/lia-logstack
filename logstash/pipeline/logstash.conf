input {
  file {
    path => "/logs/app.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"  # so it re-reads on container restart
  }
}

filter {
  # Example: parse log level from java.util.logging format
  grok {
    match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{WORD:level}: %{GREEDYDATA:msg}" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "java-logs"
  }
  stdout { codec => rubydebug }
}