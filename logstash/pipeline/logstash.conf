input {
  google_pubsub {
    project_id => "betterwse-analytics"
    topic => "betterwse-topic"
    subscription => "logstash_sub"
    # json_key_file => not necessary as it will be running on a google resource
    include_metadata => true
  }

  file {
    path => ["/app/i2i_log/i2i-sync-json.log"]
    start_position => "beginning"
    sincedb_path => "/dev/null"  # so it re-reads on container restart
  }
}

filter {
  json {
    source => "message"
    #skip_on_invalid_json => true
  }
}

output {

  if ["metadata][pubsub_message] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "gcp-logs-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "i2i"
    }
  }

  stdout { codec => rubydebug }
}
